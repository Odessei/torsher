name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          work="$(mktemp -d)"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" --output "$work/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $work/$archive" | sha256sum --check
          tar -xzf "$work/$archive" -C "$work" gitleaks

          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            range="$BASE_SHA..HEAD"
          else
            range="HEAD^..HEAD"
          fi

          if git log --format= --name-only "$range" | grep -Ei '(^|/)(\.env|id_(ed25519|rsa))$|\.(sqlite3?|db|p12|pfx|pem|key|age)$' > "$work/blocked-files"; then
            echo "::error::A credential or database filename was added to Git history."
            exit 1
          fi
          "$work/gitleaks" git --no-banner --redact=100 --log-opts="$range"

name: Secret scan

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          work="$(mktemp -d)"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" --output "$work/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $work/$archive" | sha256sum --check
          tar -xzf "$work/$archive" -C "$work" gitleaks

          fallback=''
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            fallback="refs/remotes/origin/$DEFAULT_BRANCH"
          fi
          range="$(python3 ops/appbox/scan_git_history.py --base "$BASE_SHA" --fallback-ref "$fallback")"
          "$work/gitleaks" git --no-banner --redact=100 --log-opts="--diff-merges=first-parent $range"

name: Package Appbox rollout candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: d5d65cabd6f8f5e67df9630e593e5b1db1252b00
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: d5d65cabd6f8f5e67df9630e593e5b1db1252b00
          persist-credentials: false

      - name: Build and scan an immutable Appbox candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          image="torsher-appbox:$SOURCE_SHA"
          version=$(node -p "require('./apps/server/package.json').version")
          docker buildx build --platform linux/amd64 --load --tag "$image" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --build-arg "TORSHER_VERSION=$version" --build-arg "TORSHER_COMMIT=$SOURCE_SHA" .
          mkdir "$RUNNER_TEMP/appbox-candidate"
          bash ops/appbox/install-security-tools.sh "$RUNNER_TEMP/appbox-tools"
          python3 ops/appbox/scan_ci_image.py --image "$image" --sqlite \
            --trivy "$RUNNER_TEMP/appbox-tools/trivy" \
            --output "$RUNNER_TEMP/appbox-candidate/evidence.json"
          docker run --rm --network none --entrypoint sh "$image" \
            -c 'test -x /usr/local/bin/torsher-engine && test -f /app/tv/dist/index.html && test -f /app/web/.output/public/index.html'
          cd "$RUNNER_TEMP/appbox-candidate"
          docker save "$image" | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: appbox-rollout-candidate-d5d65cab
          path: ${{ runner.temp }}/appbox-candidate/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

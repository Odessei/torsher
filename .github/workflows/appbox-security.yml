name: Appbox security checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '45 3 * * *'

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Scan lockfiles with OSV
        run: |
          bash ops/appbox/install-security-tools.sh "$RUNNER_TEMP/appbox-tools"
          status=0
          "$RUNNER_TEMP/appbox-tools/osv-scanner" scan source --recursive --format json --output-file "$RUNNER_TEMP/osv.json" . || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          python3 - "$RUNNER_TEMP/osv.json" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1]))
          found = {v["id"] for result in data.get("results", [])
                   for package in result.get("packages", [])
                   for v in package.get("vulnerabilities", [])}
          print("OSV unique advisories:", len(found))
          for advisory in sorted(found):
              print(advisory)
          PY

  traefik-pilot:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Scan and exercise the pinned Traefik candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_PR: ${{ github.event.pull_request.number }}
        run: |
          bash ops/appbox/install-security-tools.sh "$RUNNER_TEMP/appbox-tools"
          set -- --candidate-only
          if [ -n "$CANDIDATE_PR" ]; then set -- "$@" --pr "$CANDIDATE_PR"; fi
          python3 ops/appbox/pilot.py --state "$RUNNER_TEMP/appbox-pilot" \
            --trivy "$RUNNER_TEMP/appbox-tools/trivy" --sha "$CANDIDATE_SHA" "$@"
          cat "$RUNNER_TEMP/appbox-pilot/summary.log"

  compose-images:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        service: [torsher, prowlarr, jackett, flaresolverr]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Scan the pinned Compose image
        env:
          APPBOX_IMAGE_SERVICE: ${{ matrix.service }}
        run: |
          bash ops/appbox/install-security-tools.sh "$RUNNER_TEMP/appbox-tools"
          image=$(python3 - <<'PY'
          import json
          import os
          import re
          with open('ops/appbox/compose.images.json') as f:
              reference = json.load(f)['services'][os.environ['APPBOX_IMAGE_SERVICE']]['image']
          if not re.fullmatch(r'[a-z0-9._:/-]+:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}', reference):
              raise SystemExit('Compose image must use both an explicit tag and digest')
          print(reference)
          PY
          )
          tagged=${image%@*}
          pinned="${tagged%:*}@${image##*@}"
          docker pull --platform linux/amd64 "$pinned"
          id=$(docker image inspect --format '{{.Id}}' "$pinned")
          "$RUNNER_TEMP/appbox-tools/trivy" image --image-src docker --scanners vuln \
            --no-progress --format json --output "$RUNNER_TEMP/compose-image.json" "$id"
          python3 - "$RUNNER_TEMP/compose-image.json" <<'PY'
          import collections
          import json
          import sys
          with open(sys.argv[1]) as f:
              data = json.load(f)
          print(collections.Counter(v['Severity'] for target in data.get('Results', [])
                                    for v in target.get('Vulnerabilities') or []))
          PY

  fork-image:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and scan one linux/amd64 image
        run: |
          bash ops/appbox/install-security-tools.sh "$RUNNER_TEMP/appbox-tools"
          docker buildx build --platform linux/amd64 --load --tag appbox-torsher-candidate --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" .
          id=$(docker image inspect --format '{{.Id}}' appbox-torsher-candidate)
          "$RUNNER_TEMP/appbox-tools/trivy" image --image-src docker --scanners vuln \
            --no-progress --format json --output "$RUNNER_TEMP/fork-image.json" "$id"
          echo "Candidate image ID $id"
          python3 - "$RUNNER_TEMP/fork-image.json" <<'PY'
          import collections
          import json
          import sys
          data = json.load(open(sys.argv[1]))
          print(collections.Counter(v["Severity"] for r in data.get("Results", []) for v in r.get("Vulnerabilities") or []))
          PY
          docker run --rm --network none --entrypoint sh appbox-torsher-candidate \
            -c 'test -x /usr/local/bin/torsher-engine && test -f /app/tv/dist/index.html && test -f /app/web/.output/public/index.html'

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@antonreshetov/bumpy@0.6.0'

trustPolicy: no-downgrade
# semver 6.3.1 (последняя в ветке 6.x, её тянет @babel/core) вышла до появления
# npm provenance, поэтому no-downgrade ложно считает её понижением доверия
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - apps/*
  - packages/*

overrides:
  esbuild@<0.25.0: 0.25.12
  fast-uri@<3.1.9: 3.1.9
  fast-uri@>=4.0.0 <4.2.3: 4.2.4
  fast-xml-parser@<5.12.0: 5.12.0
  glob@>=9.0.0 <14.0.2: 14.0.6
  katex@>=0.11.0 <0.18.2: 0.18.2
  minimatch@>=7.0.0 <11.0.1: 11.0.9
  node-forge@<1.4.3: 1.4.3
  serialize-javascript@<7.1.3: 7.1.3
  tinypool@<2.1.2: 2.1.2
  zod: ^4.6.7

allowBuilds:
  esbuild: true
  simple-git-hooks: true
